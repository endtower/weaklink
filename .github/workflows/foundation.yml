name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装测试依赖
        run: python -m pip install -r requirements.txt
      - name: 验收配置隔离、SQLite 事务和事件链停止
        run: python -B scripts/run_foundation_checks.py
