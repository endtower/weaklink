name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签。留空则使用 v<Core 版本>。"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: public-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dev
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 确定发布版本
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $core = (Get-Content component_versions.json -Raw | ConvertFrom-Json).core
          if ($core -notmatch '^\d+\.\d+\.\d+$') { throw "Core 版本必须是稳定版版本号" }
          $tag = "v$core"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $tag) {
            throw "Git 标签必须是 $tag，当前为 $env:GITHUB_REF_NAME"
          }
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -cne $tag) {
            throw "发布标签必须是 $tag"
          }
          if (-not (Test-Path "releases/core-$core.json")) { throw "缺少 Core $core 发布说明" }
          $tagCommit = git rev-parse --verify --quiet "refs/tags/$tag^{commit}"
          if ($tagCommit -and $tagCommit -ne $env:GITHUB_SHA) { throw "$tag 已指向另一提交" }
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "无法检查已有 Release" }
          if ($tag -in $existing) { throw "$tag 已存在。请保留已发布产物；若有未完成的草稿，请先检查草稿。" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dev/web_frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 安装构建和验收依赖
        run: python -m pip install -r requirements.txt packaging psutil

      - name: 构建匹配的 Web UI
        working-directory: dev/web_frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci 失败" }
          npm run build

      - name: 读取上一版发布清单
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $published = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName
          if ($LASTEXITCODE -ne 0) { throw "无法读取已发布版本" }
          if (-not ($published | ConvertFrom-Json)) { exit 0 }
          $previous = gh release view --json tagName --jq '.tagName'
          if ($LASTEXITCODE -ne 0 -or -not $previous) { throw "无法读取 latest Release" }
          $catalogs = '../cache/builds/previous-catalogs'
          $history = '../cache/builds/previous-packages'
          New-Item -ItemType Directory -Force $catalogs, $history | Out-Null
          foreach ($component in @('core', 'manager', 'launcher')) {
            $catalog = "$component-versions.json"
            gh release download $previous --pattern $catalog --dir $catalogs
            if ($LASTEXITCODE -ne 0) { throw "无法读取 $previous 的 $catalog" }
            $entries = Get-Content "$catalogs/$catalog" -Raw -Encoding utf8 | ConvertFrom-Json
            if ($entries.component -ne $component -or -not $entries.releases) { throw "$catalog 无效" }
            foreach ($entry in $entries.releases) {
              if ($entry.component -ne $component -or $entry.version -notmatch '^v?\d+\.\d+\.\d+([-+][0-9A-Za-z.+-]+)?$') {
                throw "$catalog 的历史条目无效"
              }
              $entry | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 "$history/$component-$($entry.version).json"
            }
          }

      - name: 构建发布包
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $buildArgs = @(
            "scripts/build_public_release.py",
            "--output", "../cache/builds/public",
            "--feed-base-url", "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download",
            "--package-base-url", "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          )
          if (Test-Path ../cache/builds/previous-packages) { $buildArgs += @("--previous-releases", "../cache/builds/previous-packages") }
          python @buildArgs

      - name: 用全新目录验收首次安装和 Core 更新
        run: python scripts/acceptance_public_source_install.py --release ../cache/builds/public

      - name: 发布通过验收的产物
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $assets = @("../cache/builds/public/download/AbyssLauncher.exe") + (Get-ChildItem ../cache/builds/public/packages -File | ForEach-Object FullName)
          $notes = "下载 AbyssLauncher.exe 安装。Core 版本说明见 core-latest.json。"
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --latest --title "弱链接 $env:RELEASE_TAG" --notes $notes
